<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopWave — Modern E-Commerce</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-inner">
      <a href="#" class="logo" onclick="navigate('home')">
        <span class="logo-wave">~</span>ShopWave
      </a>
      <div class="nav-search">
        <input type="text" id="search-input" placeholder="Search products…" />
        <button onclick="handleSearch()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>
      <div class="nav-actions">
        <button class="nav-btn" onclick="navigate('shop')">Shop</button>
        <button class="nav-btn cart-btn" onclick="navigate('cart')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cart-count">0</span>
        </button>
        <div id="auth-nav">
          <button class="nav-btn btn-primary" onclick="navigate('login')">Sign In</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main id="app"></main>

  <!-- TOAST -->
  <div id="toast-container"></div>

  <!-- MODAL OVERLAY -->
  <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
    <div id="modal-content" onclick="event.stopPropagation()"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
